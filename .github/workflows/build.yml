name: Build Woz Shell
on: [workflow_dispatch, push]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore persistent signing key
        env:
          WOZ_KEY: ${{ secrets.WOZ_DEBUG_KEY }}
        run: |
          if [ -z "$WOZ_KEY" ]; then
            echo "WOZ_DEBUG_KEY secret missing. Configure persistent signing before building."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$WOZ_KEY" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WozShell
          path: app/build/outputs/apk/debug/app-debug.apk
